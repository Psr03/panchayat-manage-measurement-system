// ====================== APP LOADING OVERLAY ======================
function showAppLoading(msg) {
  var overlay = document.getElementById('loadingOverlay');
  if (!overlay) return;
  var p = overlay.querySelector('.loading-spinner p');
  if (p) p.textContent = msg || 'Loading...';
  overlay.classList.remove('hidden');
}
function hideAppLoading() {
  var overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.classList.add('hidden');
}

// ====================== INITIALIZATION ======================
document.addEventListener('DOMContentLoaded', function() {
  var loadingEl = document.getElementById('loadingOverlay');
  if (loadingEl) loadingEl.classList.add('hidden');
  checkSavedSession();
  
  var userIdEl = document.getElementById('loginUserId');
  if(userIdEl) {
    userIdEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('loginPassword').focus(); }
    });
  }

  function clearLoginErrorsOnInteract() {
    var ug = document.getElementById('userIdGroup');
    var pg = document.getElementById('passwordGroup');
    var ue = document.getElementById('userIdError');
    var pe = document.getElementById('passwordError');
    var banner = document.getElementById('loginErrorBanner');
    if (ug) ug.classList.remove('has-error');
    if (pg) pg.classList.remove('has-error');
    if (ue) ue.style.display = 'none';
    if (pe) pe.style.display = 'none';
    if (banner) banner.classList.remove('show');
  }

  window.closeForgotInfo = function() {
    var infoBanner = document.getElementById('forgotInfoBanner');
    if (infoBanner) infoBanner.classList.remove('show');
  };

  ['loginUserId', 'loginPassword'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) {
      el.addEventListener('focus', clearLoginErrorsOnInteract);
      el.addEventListener('input', clearLoginErrorsOnInteract);
      el.addEventListener('click', clearLoginErrorsOnInteract);
    }
  });

  var sendOtpLink = document.getElementById('sendOtpLink');
  if (sendOtpLink) {
    sendOtpLink.addEventListener('click', function(e) {
      e.preventDefault();
      requestOtp();
    });
  }

  document.querySelectorAll('.otp-input').forEach(function(input, index, inputs) {
    input.addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
      if (this.value.length === 1 && index < inputs.length - 1) inputs[index + 1].focus();
    });
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && this.value === '' && index > 0) inputs[index - 1].focus();
      if (e.key === 'Enter') { e.preventDefault(); verifyOtp(); }
    });
    input.addEventListener('paste', function(e) {
      e.preventDefault();
      var pasteData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
      if (pasteData.length >= 4) {
        for (var pi = 0; pi < 4; pi++) inputs[pi].value = pasteData[pi];
        inputs[3].focus();
        setTimeout(function() { verifyOtp(); }, 200);
      }
    });
  });
  
  setupEventListeners();
});

// ====================== SESSION PERSISTENCE ======================
function checkSavedSession() {
  var savedUser = null;
  try {
    savedUser = localStorage.getItem('measureProUser') || sessionStorage.getItem('measureProUser');
  } catch(e) { console.error("Storage access error:", e); return; }
  
  if (savedUser) {
    try {
      var userData = JSON.parse(savedUser);
      currentUser = userData;
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('appContent').style.display = 'block';
      var loadingEl = document.getElementById('loadingOverlay');
      if (loadingEl) loadingEl.classList.add('hidden');
      
      updateUserInfoUI();
      applyRoleBasedMenuVisibility(currentUser.type);
      checkPasswordExpiry(); 
      
      if (!appInitialized) { 
        showAppLoading('Restoring your session...');
        initializeApp(); 
        appInitialized = true; 
      }
    } catch(e) {
      console.error("Session restore parsing error:", e);
      try { localStorage.removeItem('measureProUser'); sessionStorage.removeItem('measureProUser'); } catch(e2) {}
    }
  }
}

function updateUserInfoUI() {
  if (!currentUser) return;
  var initials = currentUser.name.split(' ').map(function(n){ return n[0]; }).join('').substring(0,2).toUpperCase();
  document.querySelector('.user-avatar').textContent = initials;
  document.querySelector('.user-name').textContent = currentUser.name;
  document.querySelector('.user-role').textContent = currentUser.type + ' - ' + currentUser.janpad;
  
  document.getElementById('settingsUserName').value = currentUser.name;
  document.getElementById('settingsUserRole').value = currentUser.type;
  document.getElementById('settingsUserJanpad').value = currentUser.janpad;
  document.getElementById('settingsUserId').value = currentUser.userId;
  document.getElementById('settingsUserEngineer').value = currentUser.engineer || '--';
  document.getElementById('settingsUserMobile').value = currentUser.mobile || '--';
  document.getElementById('settingsUserGmail').value = currentUser.gmail || '--';
  document.getElementById('settingsPwdGenDate').value = formatSafeDate(currentUser.pwdGenDate);
  document.getElementById('settingsPwdExpDate').value = formatSafeDate(currentUser.pwdExpDate);
  document.getElementById('settingsUserStatus').value = 'Active';
  
  var navSec = document.getElementById('navSecurity');
  if (navSec) navSec.style.display = (currentUser.type === 'Owner') ? 'flex' : 'none';
}

// ====================== LOGIN SYSTEM ======================
function loginUser() {
  if (isLoginInProgress) return;
  var userId = document.getElementById('loginUserId').value.trim();
  var password = document.getElementById('loginPassword').value.trim();
  
  clearLoginErrors();
  var hasError = false;
  if (!userId) { showFieldError('userIdGroup', 'userIdError', 'User ID is required'); hasError = true; }
  if (!password) { showFieldError('passwordGroup', 'passwordError', 'Password is required'); hasError = true; }
  if (hasError) return;
  
  isLoginInProgress = true;
  var btn = document.getElementById('loginBtn');
  btn.classList.add('loading');
  btn.disabled = true;
  
  google.script.run
    .withSuccessHandler(function(response) {
      isLoginInProgress = false;
      btn.classList.remove('loading');
      btn.disabled = false;
      
      if (response && response.success) {
        currentUser = response;
        var rememberMe = document.getElementById('rememberMe').checked;
        var storage = rememberMe ? localStorage : sessionStorage;
        try { storage.setItem('measureProUser', JSON.stringify(response)); } catch(e) { console.error("Storage error:", e); }
        
        showToast("Welcome, " + currentUser.name + "!", "success");
        addNotification('info', 'Logged in successfully as ' + currentUser.name);
        
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('appContent').style.display = 'block';
        showAppLoading('Loading your data...');
        
        updateUserInfoUI();
        applyRoleBasedMenuVisibility(currentUser.type);
        checkPasswordExpiry(); 
        
        if (!appInitialized) { initializeApp(); appInitialized = true; }
      } else {
        var errorMsg = "Invalid User ID or Password!";
        if (response && response.message) errorMsg = response.message;
        showLoginError(errorMsg);
        shakeLoginCard();
      }
    })
    .withFailureHandler(function(e) {
      isLoginInProgress = false;
      btn.classList.remove('loading');
      btn.disabled = false;
      showLoginError("Server Error: " + e.message);
      shakeLoginCard();
    })
    .authenticateUser(userId, password);
}

function showFieldError(groupId, errorId, message) {
  var group = document.getElementById(groupId);
  var errorEl = document.getElementById(errorId);
  if (group) group.classList.add('has-error');
  if (errorEl) { errorEl.textContent = message; errorEl.style.display = 'flex'; }
}
function clearLoginErrors() {
  document.querySelectorAll('.login-input-group').forEach(function(g) { g.classList.remove('has-error'); });
  document.querySelectorAll('.login-error-msg').forEach(function(e) { e.style.display = 'none'; });
  var banner = document.getElementById('loginErrorBanner');
  if (banner) banner.classList.remove('show');
  var infoBanner = document.getElementById('forgotInfoBanner');
  if (infoBanner) infoBanner.classList.remove('show');
}
function showLoginError(message) {
  var banner = document.getElementById('loginErrorBanner');
  var text = document.getElementById('loginErrorText');
  if (text) text.textContent = message;
  if (banner) banner.classList.add('show');
}
function shakeLoginCard() {
  var card = document.getElementById('loginCard');
  if (!card) return;
  card.classList.add('shake');
  setTimeout(function() { card.classList.remove('shake'); }, 600);
}
function toggleLoginPassword() {
  var passInput = document.getElementById('loginPassword');
  var icon = document.getElementById('togglePasswordIcon');
  if (passInput.type === 'password') { passInput.type = 'text'; icon.className = 'ri-eye-line'; }
  else { passInput.type = 'password'; icon.className = 'ri-eye-off-line'; }
}

// ====================== ROLE-BASED MENU VISIBILITY ======================
function applyRoleBasedMenuVisibility(userType) {
  var isPanchayat = (userType === 'Panchayat');
  var isEngineer = (userType === 'Engineer');
  
  var navTemplates = document.getElementById('navTemplates');
  var navSpecifications = document.getElementById('navSpecifications');
  var navSecurity = document.getElementById('navSecurity');
  var navValuationMenu = document.getElementById('navValuationMenu'); // ✅ ID बदला गया
  var qaTemplates = document.getElementById('qaTemplates');
  var qaSpecifications = document.getElementById('qaSpecifications');
  var btnAddSpec = document.getElementById('btnAddSpec');
  
  if (navTemplates) navTemplates.style.display = isPanchayat ? 'none' : 'flex';
  if (qaTemplates) qaTemplates.style.display = isPanchayat ? 'none' : 'flex';
  if (navSpecifications) navSpecifications.style.display = (isPanchayat || isEngineer) ? 'none' : 'flex';
  if (qaSpecifications) qaSpecifications.style.display = (isPanchayat || isEngineer) ? 'none' : 'flex';
  if (btnAddSpec) btnAddSpec.style.display = (isEngineer || isPanchayat) ? 'none' : 'block';
  if (navSecurity) navSecurity.style.display = (userType === 'Owner') ? 'flex' : 'none';
  if (navValuationMenu) navValuationMenu.style.display = isPanchayat ? 'none' : 'flex'; // ✅ अपडेटेड लॉजिक
}

  showConfirm("Are you sure you want to logout?", function() {
    currentUser = null;
    appInitialized = false;

    swFilteredWorks = [];
    isLoginInProgress = false;
    
    try { localStorage.removeItem('measureProUser'); sessionStorage.removeItem('measureProUser'); } catch(e) {}

    var ps = document.getElementById('panchayatSelect');
    if(js) { js.disabled = false; js.dataset.roleLocked = 'false'; }
    if(es) { es.disabled = false; es.dataset.roleLocked = 'false'; }
    if(ps) { ps.disabled = false; ps.dataset.roleLocked = 'false'; }

  loadSpecificationsFromSheets();
  loadDropdownData();
  loadTemplates();
  loadProvisions();
  loadAllSavedWorks(); 
  
  var savedPage = sessionStorage.getItem('currentPage');

function setupEventListeners() {
  document.getElementById("sorSelect").addEventListener('change', updateWorkInfoSection);
  document.getElementById("engineerSelect").addEventListener('change', updateWorkInfoSection);
  document.getElementById("workName").addEventListener('input', updateWorkInfoSection);
  document.getElementById("panchayatSelect").addEventListener('change', updateWorkInfoSection);
  document.getElementById("janpadSelect").addEventListener('change', updateWorkInfoSection);
  document.getElementById("templateSorType").addEventListener('change', function() { updateSummaryBoxBasedOnSOR(); calc(); });
  
  var hni = document.getElementById("headingNameInput");
  if (hni) hni.addEventListener('keypress', function(e) { if (e.key === 'Enter') saveHeadingName(); });

  var loginForm = document.getElementById('loginForm');
  if (loginForm) {
    loginForm.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); loginUser(); }
    });
  }

  document.addEventListener("click", function(e) {
    if (e.target.closest('.toggle-collapse')) {
      var table = e.target.closest('table');
      if (table) table.classList.toggle('collapsed');
    }
   
    if (e.target.closest(".open-spec-btn")) openSpecModal(e.target.closest(".open-spec-btn"));
    if (e.target.closest(".open-spec-btn")) openSpecModal(e.target.closest(".open-spec-btn"));
    if (e.target.closest(".delete-heading-btn")) deleteHeadingSection(e.target.closest(".delete-heading-btn"));
    if (e.target.closest(".add-row-btn")) addRow(e.target.closest(".add-row-btn"));
    if (e.target.closest(".duplicate-row-btn")) duplicateRow(e.target.closest(".duplicate-row-btn"));
    if (e.target.closest(".change-spec-btn")) changeSpecTable(e.target.closest(".change-spec-btn"));
    if (e.target.closest(".duplicate-table-btn")) duplicateTable(e.target.closest(".duplicate-table-btn"));
    if (e.target.closest(".move-up-btn")) moveTableUp(e.target.closest(".move-up-btn"));
    if (e.target.closest(".move-down-btn")) moveTableDown(e.target.closest(".move-down-btn"));
    if (e.target.closest(".delete-row-btn")) deleteRow(e.target.closest(".delete-row-btn"));
    if (e.target.closest(".delete-table-btn")) {
      var t = e.target.closest("table");
      if (t) { var wr = t.closest(".table-scroll-wrapper"); if (wr) wr.remove(); updateAllTableNumbers(); calc(); }
    }
    if (e.target.closest(".add-deduction-btn")) addDeductionSection(e.target.closest(".add-deduction-btn"));
    if (e.target.closest(".delete-deduction-btn")) deleteDeductionSection(e.target.closest(".delete-deduction-btn"));
    
    // ✅ यह लाइन जोड़ दें ताकि बाहर क्लिक करने पर नोटिफिकेशन बंद हो
    if (!e.target.closest('#notifBtn') && !e.target.closest('.notifications-dropdown')) {
      var notifDropdown = document.getElementById('notificationsDropdown');
      if (notifDropdown) notifDropdown.classList.remove('show');
    }
  });

  document.addEventListener("input", function(e) {
    if (e.target.closest('.table-scroll-wrapper')) updateScrollHint(e.target.closest('.table-scroll-wrapper'));
    if (e.target.classList.contains("length") || e.target.classList.contains("breadth") || e.target.classList.contains("height") || e.target.classList.contains("cf") || e.target.classList.contains("no")) {
      clearTimeout(calcDebounceTimer);
      calcDebounceTimer = setTimeout(function() { calc(); }, 120);
    }
  });

  document.addEventListener("scroll", function(e) {
    if (e.target.classList && e.target.classList.contains('table-scroll-wrapper')) updateScrollHint(e.target);
  }, true);

  document.addEventListener("focusout", function(e) {
    if (e.target.classList.contains("length") || e.target.classList.contains("breadth") || e.target.classList.contains("height") || e.target.classList.contains("cf")) {
      var text = e.target.textContent.trim();
      if (text !== '' && !isNaN(parseFloat(text)) && isFinite(text) && !/[+\-*/()]/.test(text)) {
        e.target.textContent = parseFloat(text).toFixed(3);
      }
      calc();
    }
    if (e.target.classList.contains("no")) {
      var noText = e.target.textContent.trim();
      if (noText !== '' && !isNaN(parseFloat(noText)) && isFinite(noText) && !/[+\-*/()]/.test(noText)) {
        e.target.textContent = parseFloat(noText).toFixed(0);
      }
      calc();
    }
  });
  
  document.getElementById('mainContent').addEventListener('click', function(e) {
    if (e.target.closest('.mobile-toggle')) return;
    var sidebar = document.getElementById('sidebar');
    if (window.innerWidth <= 768 && sidebar.classList.contains('mobile-open')) {
      sidebar.classList.remove('mobile-open');
    }
  });

  document.addEventListener("keydown", function(e) {
    if (e.key === 'Enter' && (e.target.classList.contains("length") || e.target.classList.contains("breadth") || e.target.classList.contains("height") || e.target.classList.contains("cf") || e.target.classList.contains("no"))) {
      e.preventDefault();
      var text = e.target.textContent.trim();
      if (e.target.classList.contains("no")) {
        if (text !== '' && !isNaN(parseFloat(text)) && isFinite(text) && !/[+\-*/()]/.test(text)) e.target.textContent = parseFloat(text).toFixed(0);
      } else {
        if (text !== '' && !isNaN(parseFloat(text)) && isFinite(text) && !/[+\-*/()]/.test(text)) e.target.textContent = parseFloat(text).toFixed(3);
      }
      calc();
      var row = e.target.closest("tr");
      if (row) {
        var nextRow = row.nextElementSibling;
        if (nextRow) {
          var nextInput = nextRow.querySelector("td[contenteditable='true'].length") || nextRow.querySelector("td[contenteditable='true']");
          if (nextInput) nextInput.focus();
        }
      }
    }
  });
}

function setupWorkDetailTabs() {
  var reportTab = document.querySelector('#page-workDetail .wd-tab-btn[data-tab="report"]');
  var drawingTab = document.querySelector('#page-workDetail .wd-tab-btn[data-tab="drawing"]');

  if (reportTab) reportTab.style.display = '';

// ====================== NAVIGATION ======================
function navigateTo(page) {
  if (page === 'security' && (!currentUser || currentUser.type !== 'Owner')) {
    showToast("Access Denied! Only Owner can view this page.", "error");
    return;
  }
  currentPage = page;
  sessionStorage.setItem('currentPage', page);
  isTemplateBuilderMode = (page === 'templateBuilder');
  
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  var tp = document.getElementById('page-' + page);
  if (tp) tp.classList.add('active');
  
  document.querySelectorAll('.nav-item').forEach(function(item) { item.classList.remove('active'); });
  document.querySelectorAll('.nav-subitem').forEach(function(item) { item.classList.remove('active'); });
  document.querySelectorAll('.nav-submenu.open').forEach(function(sm) { sm.style.maxHeight = '0px'; sm.classList.remove('open'); });
  document.querySelectorAll('.has-submenu.open').forEach(function(hs) { hs.classList.remove('open'); });
  
  var activeNavPage = page, openSubmenuId = null, highlightStatus = null, highlightTplType = null;
  
  if (page === 'newWork' || page === 'workDetail') {
    activeNavPage = 'savedWorks';
    openSubmenuId = 'savedWorksSubmenu';
    if (page === 'workDetail') highlightStatus = currentSavedWorkStatus || '';
  }
  if (page === 'templateBuilder') {
    activeNavPage = 'templates';
    openSubmenuId = 'templateSubmenu';
    highlightTplType = currentTemplateType || 'UT';
  }

  if (page === 'valuation') {
    var valMenu = document.getElementById('navValuationMenu');
    if (valMenu) valMenu.classList.add('active');
  } else {
    var ni = document.querySelector('.nav-item[data-page="' + activeNavPage + '"]');
    if (ni) ni.classList.add('active');
  }
  
  if (openSubmenuId) {
    var submenu = document.getElementById(openSubmenuId);
    if (submenu) { submenu.classList.add('open'); submenu.style.maxHeight = submenu.scrollHeight + "px"; }
    var parentItem = document.querySelector('.has-submenu[data-page="' + activeNavPage + '"]');
    if (parentItem) parentItem.classList.add('open');
  }
  
  if (highlightStatus !== null && openSubmenuId === 'savedWorksSubmenu') {
    document.querySelectorAll('#savedWorksSubmenu .nav-subitem').forEach(function(item) {
      if (item.getAttribute('data-status') === highlightStatus) item.classList.add('active');
    });
  }
  if (highlightTplType && openSubmenuId === 'templateSubmenu') {
    document.querySelectorAll('#templateSubmenu .nav-subitem').forEach(function(item) {
      if (item.getAttribute('data-tpl-type') === highlightTplType) item.classList.add('active');
    });
  }
  
  var titles = { 'dashboard':'Dashboard','newWork':'New Work','savedWorks':'Saved Works','specifications':'Specifications','settings':'Settings','workDetail': 'Work Estimate','report':'Technical Report','templates':'Templates','templateBuilder':'Template Builder', 'valuation':'Work Valuation' };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  
  if (page === 'savedWorks') loadSavedWorks();
  if (page === 'specifications') loadSpecPageList(currentSpecTab);
  if (page === 'dashboard') loadDashboardStats();
  if (page === 'templates') filterTemplateGrid();
  if (page === 'security') loadUsersForAdmin();
  if (page === 'workDetail') setupWorkDetailTabs();
  
  document.getElementById('sidebar').classList.remove('mobile-open');
}

function navigateToTemplates(type) {
  currentTemplateType = type || 'UT';
  navigateTo('templates');
  document.querySelectorAll('.nav-subitem').forEach(function(item) {
    item.classList.remove('active');
    if (item.getAttribute('data-tpl-type') === currentTemplateType) item.classList.add('active');
  });
  var submenu = document.getElementById('templateSubmenu');
  if (submenu) { submenu.classList.add('open'); submenu.style.maxHeight = submenu.scrollHeight + "px"; }
  var parentItem = document.querySelector('.has-submenu');
  if (parentItem) parentItem.classList.add('open');

  setTimeout(function() {
    document.querySelectorAll('.tpl-type-tab').forEach(function(tab) {
      tab.classList.remove('active');
      if (tab.getAttribute('data-type') === currentTemplateType) tab.classList.add('active');
    });
    filterTemplateGrid();
  }, 50);
}

function navigateToSavedWorks(status) {
  isValuationMode = false;
  currentSavedWorkStatus = status || '';
  navigateTo('savedWorks');
  document.querySelectorAll('#savedWorksSubmenu .nav-subitem').forEach(function(item) {
    item.classList.remove('active');
    if (item.getAttribute('data-status') === currentSavedWorkStatus) item.classList.add('active');
  });
  var submenu = document.getElementById('savedWorksSubmenu');
  if (submenu) { submenu.classList.add('open'); submenu.style.maxHeight = submenu.scrollHeight + "px"; }
  var parentItem = document.querySelector('.nav-item.has-submenu[data-page="savedWorks"]');
  if (parentItem) parentItem.classList.add('open');
}

function navigateToValuationList() {
  isValuationMode = false;
  currentSavedWorkStatus = 'Valuation';
  
  currentPage = 'savedWorks';
  sessionStorage.setItem('currentPage', 'savedWorks');
  isTemplateBuilderMode = false;
  
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  var tp = document.getElementById('page-savedWorks');
  if (tp) tp.classList.add('active');
  
  // सभी मेन्यू हाइलाइट्स हटाएँ
  document.querySelectorAll('.nav-item').forEach(function(item) { item.classList.remove('active'); });
  document.querySelectorAll('.nav-subitem').forEach(function(item) { item.classList.remove('active'); });
  
  // Works वाला सबमेन्यू बंद रखें

function formatNumber(n) { if(n>=10000000) return (n/10000000).toFixed(2)+' Cr'; if(n>=100000) return (n/100000).toFixed(2)+' L'; if(n>=1000) return (n/1000).toFixed(2)+' K'; return n.toFixed(2); }
function formatIndianCurrency(n) {
  if (n === 0) return '0.00';
  var isNeg = n < 0; n = Math.abs(n);
  var parts = n.toFixed(2).split('.');
  var intPart = parts[0], decPart = parts[1];
  if (intPart.length <= 3) return (isNeg ? '-' : '') + intPart + '.' + decPart;
  var last3 = intPart.substring(intPart.length - 3);
  var rest = intPart.substring(0, intPart.length - 3);
  var formatted = '';
  while (rest.length > 2) { formatted = ',' + rest.substring(rest.length - 2) + formatted; rest = rest.substring(0, rest.length - 2); }
  formatted = rest + formatted + ',' + last3;
  return (isNeg ? '-' : '') + formatted + '.' + decPart;
}
function getWorkAmount(w) {
  var a = parseFloat(w['Total Amount']) || 0;
  if (a > 0) return a;
  var estStr = w['Estimate Data'];
  if (!estStr || String(estStr).trim() === '') return 0;
  try {
    var ed = JSON.parse(estStr);
    var gt1 = 0;
    if (ed.sections) {
      ed.sections.forEach(function(sec) {
        if (sec.specs) {
          sec.specs.forEach(function(sp) {
            var qty = 0;
            if (sp.measurements) {
              sp.measurements.forEach(function(m) {
                var no = String(m.no || '').trim() ? safeMathEval(String(m.no)) : 1;
                var l = String(m.l || '').trim() ? safeMathEval(String(m.l)) : 1;
                var b = String(m.b || '').trim() ? safeMathEval(String(m.b)) : 1;
                var h = String(m.h || '').trim() ? safeMathEval(String(m.h)) : 1;
                var cf = String(m.cf || '').trim() ? safeMathEval(String(m.cf)) : 1;
                var q = no * l * b * h * cf;
                if (m.isDeduction) q = -q;
                qty += q;
              });
            }
            gt1 += qty * (parseFloat(sp.rate1) || 0);
          });
        }
      });
    }
    var cib = 0, extra = 0;
    if (ed.summary) { cib = parseFloat(ed.summary.cib) || 0; extra = parseFloat(ed.summary.extraWork) || 0; }
    var sub = gt1 + cib + extra;
    var elecAmt = 0, saniAmt = 0, totalAmt = sub, dedAmt = 0, gstAmt = 0, contAmt = 0;
    if (ed.summary) {
      var em = (ed.summary.elecLabel || '').match(/(\d+(\.\d+)?)\s*%/); if (em) elecAmt = (sub * parseFloat(em[1])) / 100;
      var sm = (ed.summary.saniLabel || '').match(/(\d+(\.\d+)?)\s*%/); if (sm) saniAmt = (sub * parseFloat(sm[1])) / 100;
      totalAmt = sub + elecAmt + saniAmt;
      var dm = (ed.summary.deductLabel || '').match(/(\d+(\.\d+)?)\s*%/); if (dm) dedAmt = (totalAmt * parseFloat(dm[1])) / 100;
      var gm = (ed.summary.gstLabel || '').match(/(\d+(\.\d+)?)\s*%/); if (gm) gstAmt = ((totalAmt - dedAmt) * parseFloat(gm[1])) / 100;
      var cm = (ed.summary.contLabel || '').match(/(\d+(\.\d+)?)\s*%/); if (cm) contAmt = ((totalAmt - dedAmt) * parseFloat(cm[1])) / 100;
    }
    return totalAmt - dedAmt + gstAmt + contAmt;
  } catch(e) { return 0; }
}

function populateSearchDropdowns() {
  var roleFiltered = getRoleFilteredWorks(allSavedWorks);
  var ps = document.getElementById('searchPanchayat'), currentVal = ps.value;
  ps.innerHTML = '<option value="">All</option>';
  var panchayatSource = (currentUser && (currentUser.type === "Owner" || currentUser.type === "Admin")) ? allSavedWorks : roleFiltered;
  var uP = [];

  uP.sort();
  uP.forEach(function(p) { var o = document.createElement('option'); o.value = p; o.textContent = p; ps.appendChild(o); });
  if (currentVal && uP.indexOf(currentVal) !== -1) ps.value = currentVal;
  if (currentUser && currentUser.type === "Panchayat") { ps.value = currentUser.name; ps.disabled = true; } else ps.disabled = false;
  var searchInput = document.getElementById('searchWork'); if (searchInput && searchInput.tagName === 'INPUT') searchInput.value = '';
  filterSavedWorks();
}
function filterSavedWorks() {
  var pf = document.getElementById('searchPanchayat').value;
  var searchInput = document.getElementById('searchWork');
  var wf = searchInput ? searchInput.value.trim().toLowerCase() : '';
  var sf = currentSavedWorkStatus;
  var f = getRoleFilteredWorks(allSavedWorks);
  
  // ✅ अब 'Estimated' मेन्यू में सिर्फ वही वर्क्स दिखेंगे जिनकी 'Estimate Data' सेव हुई है
  if (sf === 'Valuation') {
    f = f.filter(function(w) { return w.Status === 'Inbox' || w.Status === 'Estimated' || w.Status === 'Valuation'; });
  } 
  else if (sf === 'Estimated') {
    f = f.filter(function(w) { 
      return (w.Status === 'Estimated' || w.Status === 'Valuation') && w['Estimate Data'] && String(w['Estimate Data']).trim() !== ''; 
    });
  }
  else if (sf) {
    f = f.filter(function(w) { return w.Status === sf; });
  }
  
  if (pf) f = f.filter(function(w) { return w.Panchayat === pf; });
  if (wf) f = f.filter(function(w) { return (w.Work || '').toLowerCase().indexOf(wf) !== -1; });
  
  swFilteredWorks = f; 
  swCurrentPage = 1; 
  displaySavedWorks();
}
function displaySavedWorks() {
  var sw = swFilteredWorks;
  var totalRows = sw.length;
  var totalPages = Math.ceil(totalRows / swRowsPerPage); if (totalPages === 0) totalPages = 1;
  if (swCurrentPage > totalPages) swCurrentPage = totalPages; if (swCurrentPage < 1) swCurrentPage = 1;
  var startIdx = (swCurrentPage - 1) * swRowsPerPage, endIdx = Math.min(startIdx + swRowsPerPage, totalRows);
  var pageData = sw.slice(startIdx, endIdx);
  var tb = document.getElementById("savedWorkTableBody");
  var isPanch = currentUser && currentUser.type === 'Panchayat';
  if (pageData.length === 0) tb.innerHTML = '<tr><td colspan="6" class="empty-row">No works found</td></tr>';
  else {
    tb.innerHTML = pageData.map(function(w) {
      var oi = allSavedWorks.indexOf(w);
      
      // ✅ दोनों अमाउंट्स अलग-अलग निकालें
      var estAmt = getAmountFromData(w, 'Estimate Data');
      var valAmt = getAmountFromData(w, 'Valuation Data');
      
      var sc = w.Status === 'Estimated' ? 'estimated' : w.Status === 'Measured' ? 'measured' : w.Status === 'Inbox' ? 'inbox' : w.Status === 'Valuation' ? 'valuation' : 'draft';
      var hasEstimate = w['Estimate Data'] && w['Estimate Data'].trim() !== '';
      
      var estDisplay = estAmt > 0 ? '\u20B9' + formatIndianCurrency(estAmt) : '—';
      var valDisplay = valAmt > 0 ? '\u20B9' + formatIndianCurrency(valAmt) : '—';
      
      // ✅ पंचायत के लिए सिर्फ View बटन दिखाएँ, बाकी के लिए View और Delete दोनों
      var actionCell = isPanch 
        ? '<div class="action-btns"><button class="btn-icon" onclick="viewWorkDetail(' + oi + ')" title="View"><i class="ri-eye-line"></i></button></div>'
        : '<div class="action-btns"><button class="btn-icon" onclick="viewWorkDetail(' + oi + ')" title="View"><i class="ri-eye-line"></i></button><button class="btn-icon" onclick="deleteWorkAction(' + oi + ')" title="Delete" style="color:var(--danger)"><i class="ri-delete-bin-line"></i></button></div>';
        
      // ✅ टेबल रो में नया कॉलम जोड़ें
      return '<tr><td>' + (w['Sr no'] || '') + '</td><td>' + w.Panchayat + '</td><td><span class="status-dot ' + sc + '" title="' + (w.Status || 'Draft') + '"></span> ' + w.Work + (hasEstimate ? ' <i class="ri-draft-line" style="font-size:11px;color:var(--primary);" title="Estimate Saved"></i>' : '') + '</td><td class="text-right">' + estDisplay + '</td><td class="text-right">' + valDisplay + '</td><td>' + actionCell + '</td></tr>';
    }).join('');
  }
  renderSavedWorksPagination(totalRows, totalPages, startIdx, endIdx);
}

  var container = document.getElementById("headingSectionsContainer");

  if (estData.summary) {

    if (estData.summary.extraWork && parseFloat(estData.summary.extraWork) > 0) document.getElementById("extraWorkAmt").textContent = estData.summary.extraWork;
    if (estData.summary.elecLabel) document.getElementById("elecLabel").textContent = estData.summary.elecLabel;
    if (estData.summary.saniLabel) document.getElementById("saniLabel").textContent = estData.summary.saniLabel;
    if (estData.summary.deductLabel) document.getElementById("deductLabel").textContent = estData.summary.deductLabel;
    if (estData.summary.gstLabel) document.getElementById("gstLabel").textContent = estData.summary.gstLabel;
    if (estData.summary.contLabel) document.getElementById("contLabel").textContent = estData.summary.contLabel;
  }
  if (estData.provisions && estData.provisions.length > 0) currentEstimateProvisions = estData.provisions;
  else currentEstimateProvisions = [];
  if (estData.drawing && estData.drawing !== '') {
    loadDriveDrawings(estData.drawing);
    var mimeType = 'image';

    if(sel && sel.value.indexOf('application/pdf') !== -1) mimeType = 'application/pdf';
    previewDriveDrawing({ value: estData.drawing + '|' + mimeType });

  if (estData.sections && estData.sections.length > 0) {
    estData.sections.forEach(function(sec) {

    });
    updateAllTableNumbers(); calc();
  }
}

function addHeadingSection() { isTemplateBuilderMode=false; openHeadingNameModal(); }

function saveHeadingName() {
  var name = document.getElementById("headingNameInput").value.trim();
  if(!name){
    showToast("Enter a section name!","warning");
    return;
  }
  
  var containerId = isTemplateBuilderMode ? "templateSectionsContainer" : (isValuationMode ? "valuationSectionsContainer" : "headingSectionsContainer");
  var container = document.getElementById(containerId);
  
  // ✅ चेक करें कि यह नाम पहले से मौजूद तो नहीं है
  var existingSections = container.querySelectorAll(".heading-section");
  for (var i = 0; i < existingSections.length; i++) {
    var titleEl = existingSections[i].querySelector(".heading-title");
    if (titleEl) {
      var existingName = titleEl.textContent.trim();
      // नाम और नंबर को अलग करें (जैसे: "Heading / Description : 1- Road" से "Road" निकालना)
      var match = existingName.match(/^Heading\s*\/\s*Description\s*:\s*\d+\s*-\s*(.*)$/);
      if (match && match[1]) {
        existingName = match[1].trim();
      }
      
      // अगर नाम मिल जाए (छोटे-बड़े अक्षरों की परवाह नहीं)
      if (existingName.toLowerCase() === name.toLowerCase()) {
        showToast("A section with this name already exists!", "error");
        return; // सेक्शन ऐड न हो
      }
    }
  }

// ====================== CALCULATIONS ======================
function calc() {
  var containerId = "headingSectionsContainer";
  var prefix = "";
  
  if (isTemplateBuilderMode) {
    containerId = "templateSectionsContainer";
  } else if (isValuationMode) {
    containerId = "valuationSectionsContainer";
    prefix = "val";
  }
  
  var gt1 = 0, gt2 = 0;
  document.querySelectorAll("#" + containerId + " .measurement-table").forEach(function(table) {
    var tq = 0, sr = 1;
    
    table.querySelectorAll("tbody tr").forEach(function(row) {
      var sc = row.querySelector(".sno");
      var nc = row.querySelector(".no");
      var qc = row.querySelector(".quantity");
      
      if (!nc || !qc) return;
      if (row.classList.contains("spec-row") || row.classList.contains("deduction-title") || row.querySelector("th")) return;
      
      if (sc) sc.textContent = sr++;
      
      var hasValue = false;
      
      var noVal = nc.textContent.trim();
      var no = 1;
      if (noVal !== "") { 
        no = safeMathEval(noVal); 
        if (isNaN(no)) no = 0;
        hasValue = true; 
      }
      
      var lenEl = row.querySelector(".length");
      var lenVal = lenEl ? lenEl.textContent.trim() : "";
      var len = 1;
      if (lenVal !== "") { 
        len = safeMathEval(lenVal); 
        if (isNaN(len)) len = 0;
        hasValue = true; 
      }

      var brdEl = row.querySelector(".breadth");
      var brdVal = brdEl ? brdEl.textContent.trim() : "";
      var brd = 1;
      if (brdVal !== "") { 
        brd = safeMathEval(brdVal); 
        if (isNaN(brd)) brd = 0;
        hasValue = true; 
      }

      var hgtEl = row.querySelector(".height");
      var hgtVal = hgtEl ? hgtEl.textContent.trim() : "";
      var hgt = 1;
      if (hgtVal !== "") { 
        hgt = safeMathEval(hgtVal); 
        if (isNaN(hgt)) hgt = 0;
        hasValue = true; 
      }
      
      var cfEl = row.querySelector(".cf");
      var cfVal = cfEl ? cfEl.textContent.trim() : "";
      var cf = 1;
      if (cfVal !== "") { 
        cf = safeMathEval(cfVal); 
        if (isNaN(cf)) cf = 0;
        hasValue = true; 
      }
      
      if (hasValue) {
        var q = no * len * brd * hgt * cf;
        if (row.classList.contains("deduction-row")) q = -q;
        qc.textContent = q.toFixed(2);
        tq += q;
      } else {
        qc.textContent = "";
      }
    });
    
    var r1r = table.querySelector(".rate1");
    var unit = "";
    if (r1r) { var m = r1r.textContent.match(/\/\s*(\S+)$/); if (m) unit = m[1]; }
    
    var nq = table.querySelector(".netQty");
    if (nq) nq.textContent = tq.toFixed(2) + (unit ? " " + unit : "");

    var r1 = extractRate(r1r ? r1r.textContent : "");
    var r2 = extractRate((table.querySelector(".rate2") || {}).textContent || "");
    var a1 = tq * r1;
    var a2 = tq * r2;
    
    var a1c = table.querySelector(".amt1");
    var a2c = table.querySelector(".amt2");
    if (a1c) a1c.textContent = a1.toFixed(2);
    if (a2c) a2c.textContent = a2.toFixed(2);
    
    gt1 += a1;
    gt2 += a2;
  });
  
  // ✅ FIX: ID केस-सेंसिटिविटी को सुलझाने के लिए सही ID स्ट्रिंग्स का इस्तेमाल
  function cleanNum(id) {
    var el = document.getElementById(id);
    if (!el) return 0;
    var txt = el.textContent.replace(/[^0-9.]/g, "");
    return parseFloat(txt) || 0;
  }
  
  function setText(id, val) {
    var el = document.getElementById(id);
    if (el) el.textContent = val;
  }
  
  // एस्टिमेट और वैल्यूएशन के लिए अलग-अलग ID नाम
  var cibId = prefix ? prefix + "CibAmt" : "cibAmt";
  var extraId = prefix ? prefix + "ExtraWorkAmt" : "extraWorkAmt";
  var subTotalId = prefix ? prefix + "SubTotalAmt" : "subTotalAmt";
  var elecLabelId = prefix ? prefix + "ElecLabel" : "elecLabel";
  var elecAmtId = prefix ? prefix + "ElecAmt" : "elecAmt";
  var saniLabelId = prefix ? prefix + "SaniLabel" : "saniLabel";
  var saniAmtId = prefix ? prefix + "SaniAmt" : "saniAmt";
  var totalAmtId = prefix ? prefix + "TotalAmt" : "totalAmt";
  var deductLabelId = prefix ? prefix + "DeductLabel" : "deductLabel";
  var deductionAmtId = prefix ? prefix + "DeductionAmt" : "deductionAmt";
  var gstLabelId = prefix ? prefix + "GstLabel" : "gstLabel";
  var gstAmtId = prefix ? prefix + "GstAmt" : "gstAmt";
  var contLabelId = prefix ? prefix + "ContLabel" : "contLabel";
  var contAmtId = prefix ? prefix + "ContAmt" : "contAmt";
  var grossTotalId = prefix ? prefix + "GrossTotalAmt" : "grossTotalAmt";
  var sayRsId = prefix ? prefix + "SayRs" : "sayRs";
  var amountInEnglishId = prefix ? prefix + "AmountInEnglish" : "amountInEnglish";
  var amountInHindiId = prefix ? prefix + "AmountInHindi" : "amountInHindi";
  var unskilledAmtId = prefix ? prefix + "UnskilledAmt" : "unskilledAmt";
  var materialAmtId = prefix ? prefix + "MaterialAmt" : "materialAmt";
  var unskilledPercentId = prefix ? prefix + "UnskilledPercent" : "unskilledPercent";
  var materialPercentId = prefix ? prefix + "MaterialPercent" : "materialPercent";
  
  var cib = cleanNum(cibId);
  var extra = cleanNum(extraId);
  var sub = gt1 + cib + extra;
  setText(subTotalId, sub.toFixed(2));
  
  var sorType = isTemplateBuilderMode ? document.getElementById("templateSorType").value : document.getElementById("sorSelect").value;
  var elecAmt = 0, saniAmt = 0, totalAmt = sub, dedAmt = 0, gstAmt = 0, contAmt = 0;
  
  if (sorType === "R.E.S. 11-04-2022") {
    var ep = 0, elTxt = (document.getElementById(elecLabelId) || {}).textContent || "";
    var em = elTxt.match(/(\d+(\.\d+)?)\s*%/); if (em) ep = parseFloat(em[1]);
    elecAmt = (sub * ep) / 100;
    setText(elecAmtId, elecAmt.toFixed(2));

    var sp = 0, slTxt = (document.getElementById(saniLabelId) || {}).textContent || "";
    var sm = slTxt.match(/(\d+(\.\d+)?)\s*%/); if (sm) sp = parseFloat(sm[1]);
    saniAmt = (sub * sp) / 100;
    setText(saniAmtId, saniAmt.toFixed(2));

    totalAmt = sub + elecAmt + saniAmt;
    setText(totalAmtId, totalAmt.toFixed(2));

    var dp = 0, dlTxt = (document.getElementById(deductLabelId) || {}).textContent || "";
    var dm = dlTxt.match(/(\d+(\.\d+)?)\s*%/); if (dm) dp = parseFloat(dm[1]);
    dedAmt = (totalAmt * dp) / 100;
    setText(deductionAmtId, dedAmt.toFixed(2));

    var gp = 0, glTxt = (document.getElementById(gstLabelId) || {}).textContent || "";
    var gm = glTxt.match(/(\d+(\.\d+)?)\s*%/); if (gm) gp = parseFloat(gm[1]);
    gstAmt = ((totalAmt - dedAmt) * gp) / 100;
    setText(gstAmtId, gstAmt.toFixed(2));

function generateAbstractAndBOQ() {

function formatSafeDate(d) {
  if (!d) return '--';
  if (typeof d === 'string') {
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(d.trim())) return d.trim();
    var isoMatch = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (isoMatch) return isoMatch[3] + '/' + isoMatch[2] + '/' + isoMatch[1];
    var jsDate = new Date(d);
    if (!isNaN(jsDate.getTime())) { var day = String(jsDate.getDate()).padStart(2, '0'); var month = String(jsDate.getMonth() + 1).padStart(2, '0'); var year = jsDate.getFullYear(); return day + '/' + month + '/' + year; }
    return d;
  }
  if (typeof d === 'object' && d.getTime) {
    try { var day = String(d.getDate()).padStart(2, '0'); var month = String(d.getMonth() + 1).padStart(2, '0'); var year = d.getFullYear(); return day + '/' + month + '/' + year; } catch (e) {}
  }
  return String(d);
}

function convertNumberToWords(amount) {
  if (isNaN(amount)) return "Invalid amount";
  var num = Math.floor(parseFloat(amount)); num = Math.round(num / 1000) * 1000;
  if (num === 0) return "Zero Rupees Only";
  var a = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  var b = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function twoDigit(n) { if (n < 20) return a[n]; return (b[Math.floor(n / 10)] + (n % 10 ? " " + a[n % 10] : "")).trim(); }
  function threeDigit(n) { if (n < 100) return twoDigit(n); var h = Math.floor(n / 100); var rem = n % 100; return a[h] + " Hundred" + (rem ? " " + twoDigit(rem) : ""); }
  var s = "", ints = num;
  var cr = Math.floor(ints / 10000000); ints %= 10000000;
  var lk = Math.floor(ints / 100000); ints %= 100000;
  var th = Math.floor(ints / 1000); ints %= 1000;
  var h = Math.floor(ints / 100); ints %= 100;
  var d = ints;
  if (cr) s += threeDigit(cr) + " Crore ";
  if (lk) s += twoDigit(lk) + " Lakh ";
  if (th) s += twoDigit(th) + " Thousand ";
  if (h) s += a[h] + " Hundred ";
  if (d && (cr || lk || th || h)) s += "and ";
  if (d) s += twoDigit(d);
  s = s.replace(/\s+/g, " ").trim();
  return s + " Rupees Only";
}

  for (var i = startPage; i <= endPage; i++) { html += '<button class="page-btn' + (i === swCurrentPage ? ' active' : '') + '" onclick="goToSwPage(' + i + ')">' + i + '</button>'; }
  if (endPage < totalPages) { if (endPage < totalPages - 1) html += '<span style="padding:0 4px;color:var(--text-muted);">...</span>'; html += '<button class="page-btn" onclick="goToSwPage(' + totalPages + ')">' + totalPages + '</button>'; }
  html += '<button class="page-btn nav-btn" onclick="goToSwPage(' + (swCurrentPage + 1) + ')"' + (swCurrentPage >= totalPages ? ' disabled' : '') + '>Next <i class="ri-arrow-right-s-line"></i></button>';
  html += '<button class="page-btn nav-btn" onclick="goToSwPage(' + totalPages + ')"' + (swCurrentPage >= totalPages ? ' disabled' : '') + '><i class="ri-skip-forward-mini-line"></i></button>';
  html += '</div>'; container.innerHTML = html;
}

// ====================== LOGIN PARTICLES ANIMATION ======================
(function() {
  var canvas = document.getElementById('loginParticles'); if (!canvas) return;
  var ctx = canvas.getContext('2d'); var particles = []; var animId = null; var w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  function createParticles() {
    particles = []; var count = Math.min(Math.floor((w * h) / 18000), 80);
    for (var i = 0; i < count; i++) { particles.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.8 + 0.4, dx: (Math.random() - 0.5) * 0.4, dy: (Math.random() - 0.5) * 0.4, o: Math.random() * 0.5 + 0.15 }); }
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (var pi = 0; pi < particles.length; pi++) {
      var p = particles[pi]; p.x += p.dx; p.y += p.dy;
      if (p.x < 0) p.x = w; if (p.x > w) p.x = 0; if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(165,180,252,' + p.o + ')'; ctx.fill();
    }
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.strokeStyle = 'rgba(165,180,252,' + (0.08 * (1 - dist / 120)) + ')'; ctx.lineWidth = 0.6; ctx.stroke(); }
      }
    }
    animId = requestAnimationFrame(draw);
  }
  function start() { resize(); createParticles(); draw(); }
  function stop() { if (animId) cancelAnimationFrame(animId); }
  window.addEventListener('resize', function() { resize(); createParticles(); });
  var overlay = document.getElementById('loginOverlay');
  if (overlay) {
    var observer = new MutationObserver(function() { if (overlay.classList.contains('hidden')) stop(); else start(); });
    observer.observe(overlay, { attributes: true, attributeFilter: ['class'] });
    if (!overlay.classList.contains('hidden')) start();
  }
})();
